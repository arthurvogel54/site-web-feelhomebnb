<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Feel'HomeBnb — Conciergerie Premium à Nancy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400;1,600&family=Montserrat:wght@300;400;500&family=Great+Vibes&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

    :root{
      --gold:#d4af37;
      --gold-light:#f0d060;
      --gold-dim:rgba(212,175,55,0.35);
      --blue-deep:#0d1060;
      --blue-royal:#1a237e;
      --black:#05050f;
    }

    html,body{
      width:100%;height:100%;
      overflow-x:hidden;
      background:var(--black);
      font-family:'Montserrat',sans-serif;
      color:#fff;
    }

    /* ── LOADER ─────────────────────────────── */
    #loader{
      position:fixed;inset:0;
      background:var(--black);
      z-index:1000;
      display:flex;align-items:center;justify-content:center;
      flex-direction:column;gap:18px;
      /* CSS fallback: always disappear after 4s even if JS fails */
      animation: loaderOut 0.7s ease-in-out 3.8s forwards;
    }
    @keyframes loaderOut{
      to{ opacity:0; pointer-events:none; visibility:hidden; }
    }
    .loader-key{
      width:90px;height:54px;
      opacity:0;transform:translateY(-24px);
      animation: loaderKeyIn 0.7s ease-out 0.3s forwards;
    }
    @keyframes loaderKeyIn{
      to{ opacity:1; transform:translateY(0); }
    }
    .loader-brand{
      font-family:'Cormorant Garamond',serif;
      color:var(--gold);font-size:15px;letter-spacing:5px;
      opacity:0;
      animation: loaderKeyIn 0.7s ease-out 0.8s forwards;
    }
    /* CSS fallback for content elements if GSAP never runs */
    #logo,#hero-text,#properties,#window-arch,#scroll-hint{
      animation: contentIn 0.9s ease-out 4.3s forwards;
    }
    .orn{ animation: contentIn 0.7s ease-out 4.5s forwards; }
    @keyframes contentIn{ to{ opacity:1; } }

    /* ── HERO ────────────────────────────────── */
    #hero{
      position:relative;width:100%;height:100vh;min-height:680px;
      overflow:hidden;
    }

    /* right-side luxury room photo */
    .bg-room{
      position:absolute;right:0;top:0;
      width:52%;height:100%;
      background:url('https://images.unsplash.com/photo-1600566753190-17f0baa2a6c3?w=900&fit=crop&q=80') center/cover no-repeat;
      z-index:0;
    }

    /* blue wall gradient covering left+center */
    .bg-wall{
      position:absolute;inset:0;z-index:1;
      background:
        radial-gradient(ellipse 55% 65% at 42% 44%, rgba(30,38,160,0.85) 0%, rgba(13,16,96,0.92) 35%, rgba(5,5,20,0.97) 65%, rgba(5,5,15,1) 85%),
        linear-gradient(to right,
          #05050f 0%,
          #05050f 8%,
          #09093a 18%,
          #0d1060 30%,
          #1a237e 48%,
          rgba(20,28,110,0.82) 60%,
          rgba(14,16,80,0.35) 72%,
          transparent 82%
        );
    }

    /* subtle noise/texture overlay */
    .bg-wall::after{
      content:'';
      position:absolute;inset:0;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      opacity:0.08;pointer-events:none;
    }

    /* ── ORNAMENT CORNERS ────────────────────── */
    .orn{
      position:absolute;width:70px;height:70px;z-index:20;opacity:0;
    }
    .orn-tl{top:14px;left:14px}
    .orn-tr{top:14px;right:14px}
    .orn-bl{bottom:162px;left:14px}
    .orn-br{bottom:162px;right:14px}
    .orn-label{
      font-family:'Cormorant Garamond',serif;font-style:italic;
      color:var(--gold);font-size:10px;letter-spacing:2px;opacity:.7;
      position:absolute;white-space:nowrap;
    }
    .orn-tl .orn-label,.orn-bl .orn-label{left:0}
    .orn-tr .orn-label,.orn-br .orn-label{right:0}
    .orn-tl .orn-label,.orn-tr .orn-label{bottom:-16px}
    .orn-bl .orn-label,.orn-br .orn-label{top:-16px}

    /* ── LOGO ────────────────────────────────── */
    #logo{
      position:absolute;top:28px;left:50%;transform:translateX(-50%);
      text-align:center;z-index:15;opacity:0;white-space:nowrap;
    }
    .logo-svg{width:130px;height:46px;display:block;margin:0 auto 6px}
    .brand-name{
      font-family:'Cormorant Garamond',serif;font-weight:600;
      font-size:clamp(26px,3.2vw,42px);color:var(--gold);
      letter-spacing:6px;line-height:1;
      text-shadow:0 0 40px rgba(212,175,55,0.45);
    }
    .brand-sub{
      font-family:'Great Vibes',cursive;
      color:var(--gold);font-size:clamp(16px,1.9vw,24px);
      opacity:.9;display:block;margin-top:2px;
    }

    /* ── THREE.JS CANVAS ─────────────────────── */
    #key-canvas{
      position:absolute;inset:0;
      width:100%;height:100%;
      z-index:10;pointer-events:none;
    }

    /* ── HERO TEXT (LEFT) ────────────────────── */
    #hero-text{
      position:absolute;
      left:clamp(18px,4vw,58px);
      bottom:clamp(190px,22vh,230px);
      z-index:15;max-width:380px;opacity:0;
    }
    .text-bar{
      width:36px;height:1px;
      background:var(--gold);opacity:.55;margin-bottom:18px;
    }
    .hero-title{
      font-family:'Cormorant Garamond',serif;font-weight:700;
      font-size:clamp(24px,3.3vw,50px);
      color:var(--gold);line-height:1.1;
      letter-spacing:2px;text-transform:uppercase;
      margin-bottom:18px;
      text-shadow:0 2px 24px rgba(0,0,0,.6);
    }
    .hero-body{
      font-family:'Montserrat',sans-serif;font-weight:300;
      font-size:clamp(12px,1.15vw,15px);
      color:rgba(255,255,255,.82);line-height:1.8;letter-spacing:.4px;
    }

    /* ── ARCHED WINDOW ───────────────────────── */
    #window-arch{
      position:absolute;
      right:clamp(14px,3.5vw,50px);
      top:clamp(24px,5vh,52px);
      width:clamp(200px,24vw,340px);
      z-index:8;opacity:0;
    }
    .win-outer{
      position:relative;
      padding-top:128%;
      background:#ede3ce;
      border-radius:50% 50% 4px 4px / 18% 18% 0 0;
      box-shadow:
        0 30px 80px rgba(0,0,0,.55),
        inset 0 0 0 10px #fff,
        inset 0 0 0 13px #d6cba8;
    }
    .win-view{
      position:absolute;
      inset:13px;
      border-radius:calc(50% - 8px) calc(50% - 8px) 2px 2px / calc(18% - 4px) calc(18% - 4px) 0 0;
      overflow:hidden;
      background:url('https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=500&fit=crop&q=80') center/cover no-repeat,
        linear-gradient(160deg,#f9c75b 0%,#e8a830 40%,#c47820 80%,#7a4010 100%);
    }
    /* window mullions */
    .mull-v,.mull-h,.mull-h2{position:absolute;background:#ede3ce;z-index:3}
    .mull-v{left:50%;top:0;bottom:0;width:11px;transform:translateX(-50%)}
    .mull-h{top:48%;left:0;right:0;height:11px;transform:translateY(-50%)}
    .mull-h2{top:73%;left:0;right:0;height:9px}
    /* arch top horizontal bar */
    .mull-arc{
      position:absolute;top:35%;left:0;right:0;height:9px;
      background:#ede3ce;z-index:3;
    }

    /* ── PROPERTIES BAR ──────────────────────── */
    #properties{
      position:absolute;bottom:0;left:0;right:0;
      height:170px;
      padding:16px 28px;
      background:linear-gradient(to top,rgba(5,5,15,.96) 0%,rgba(5,5,15,.75) 55%,transparent 100%);
      display:flex;gap:14px;align-items:flex-end;
      z-index:20;opacity:0;
    }
    .prop-card{
      flex:1;height:130px;min-width:0;
      border-radius:13px;overflow:hidden;
      position:relative;cursor:pointer;
      border:1px solid var(--gold-dim);
      transition:border-color .3s,transform .3s;
    }
    .prop-card:hover{
      border-color:var(--gold);
      transform:translateY(-4px);
    }
    .prop-card img{
      width:100%;height:100%;object-fit:cover;
      display:block;transition:transform .45s ease;
    }
    .prop-card:hover img{transform:scale(1.07)}
    .prop-overlay{
      position:absolute;inset:0;
      background:rgba(8,8,28,.78);
      border:2px solid var(--gold);
      border-radius:12px;
      display:flex;align-items:center;justify-content:center;
      opacity:0;transition:opacity .3s ease;
    }
    .prop-card:hover .prop-overlay{opacity:1}
    .prop-overlay span{
      font-family:'Cormorant Garamond',serif;
      color:var(--gold);font-size:14px;letter-spacing:1px;font-weight:600;
      text-align:center;padding:0 8px;
    }

    /* ── SCROLL HINT ─────────────────────────── */
    #scroll-hint{
      position:absolute;bottom:180px;right:26px;
      z-index:20;display:flex;flex-direction:column;
      align-items:center;gap:5px;opacity:0;
    }
    #scroll-hint span{
      font-size:9px;letter-spacing:3px;
      color:rgba(212,175,55,.55);
      writing-mode:vertical-rl;text-transform:uppercase;
    }
    .scroll-line{
      width:1px;height:38px;
      background:linear-gradient(to bottom,var(--gold),transparent);
    }

    /* ── RESPONSIVE ──────────────────────────── */
    @media(max-width:900px){
      #window-arch{width:clamp(160px,22vw,240px)}
      #hero-text{max-width:300px;bottom:188px}
    }
    @media(max-width:640px){
      #window-arch{display:none}
      .bg-room{width:100%}
      .bg-wall{background:
        radial-gradient(ellipse 80% 70% at 50% 45%,rgba(18,24,130,.9) 0%,rgba(5,5,20,.97) 70%),
        linear-gradient(to bottom,#05050f 0%,rgba(5,5,15,.6) 100%)}
      #hero-text{left:16px;bottom:185px;max-width:260px}
      .hero-title{font-size:22px}
      #properties{overflow-x:auto;overflow-y:visible;scrollbar-width:none;padding:14px 16px;gap:10px}
      #properties::-webkit-scrollbar{display:none}
      .prop-card{min-width:150px;height:116px}
      .orn{width:48px;height:48px}
      #scroll-hint{display:none}
    }
    @media(max-width:380px){
      .brand-name{font-size:20px;letter-spacing:3px}
      #hero-text{max-width:210px}
    }
  </style>
</head>
<body>

<!-- ════════════════════════════════════════
     SCRIPTS
════════════════════════════════════════ -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script>
(function(){
'use strict';
if(typeof gsap==='undefined'){ console.error('GSAP not loaded'); return; }
gsap.registerPlugin(ScrollTrigger);

/* ── Shared mutable state (declared first so try/catch can assign) ── */
let keyGroup=null, particles=null, pGeo=null, pMat=null;
let introComplete=false, keyBaseY=0;
let parallaxX=0, parallaxY=0, mouseX=0, mouseY=0, pTime=0;
const PC=160;

/* ══════════════════════════════════════════
   THREE.JS — isolated so any GL error won't
   break GSAP or the rest of the page
══════════════════════════════════════════ */
try {
const canvas  = document.getElementById('key-canvas');
const W = window.innerWidth, H = window.innerHeight;

const renderer = new THREE.WebGLRenderer({canvas, alpha:true, antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(W, H);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.3;

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, W/H, 0.1, 100);
camera.position.set(0, 0, 6);

/* Lighting */
scene.add(new THREE.AmbientLight(0xffffff, 0.25));

const sun = new THREE.DirectionalLight(0xfff6d0, 2.2);
sun.position.set(4, 7, 5);
scene.add(sun);

const fill = new THREE.DirectionalLight(0xc8a028, 1.6);
fill.position.set(-4, -2, 3);
scene.add(fill);

const pt1 = new THREE.PointLight(0xffd060, 2.8, 12);
pt1.position.set(1, 3, 4);
scene.add(pt1);

const rim = new THREE.PointLight(0xffe090, 1.4, 14);
rim.position.set(-5, 2, 2);
scene.add(rim);

/* Environment map (simple equirectangular gradient) */
(function buildEnv(){
  const ec = document.createElement('canvas');
  ec.width = 512; ec.height = 256;
  const ctx = ec.getContext('2d');
  const g = ctx.createLinearGradient(0,0,512,0);
  g.addColorStop(0,   '#0a0a38');
  g.addColorStop(0.25,'#1a1a6e');
  g.addColorStop(0.5, '#4a3a10');
  g.addColorStop(0.75,'#8a6820');
  g.addColorStop(1,   '#2a1a08');
  ctx.fillStyle = g; ctx.fillRect(0,0,512,256);
  const et = new THREE.CanvasTexture(ec);
  et.mapping = THREE.EquirectangularReflectionMapping;
  const pmrem = new THREE.PMREMGenerator(renderer);
  pmrem.compileEquirectangularShader();
  scene.environment = pmrem.fromEquirectangular(et).texture;
  pmrem.dispose(); et.dispose();
})();

/* Gold material */
const goldMat = new THREE.MeshStandardMaterial({
  color: new THREE.Color(0xd0a830),
  metalness: 0.96, roughness: 0.08, envMapIntensity: 1.2
});
const goldMat2 = new THREE.MeshStandardMaterial({
  color: new THREE.Color(0xe8c040),
  metalness: 0.9, roughness: 0.14, envMapIntensity: 1.0
});

/* ── KEY GEOMETRY ────────────────────────── */
const _kg = new THREE.Group();
keyGroup = _kg;

// Bow: 4 interlocked rings in a 2×2 clover
const R = 0.30, tube = 0.092, off = 0.25;
[[-off,off],[ off,off],[-off,-off],[off,-off]].forEach(([x,y])=>{
  const m = new THREE.Mesh(new THREE.TorusGeometry(R,tube,22,90), goldMat);
  m.position.set(x, y, 0);
  keyGroup.add(m);
});

// Centre sphere bridging the 4 rings
keyGroup.add(Object.assign(
  new THREE.Mesh(new THREE.SphereGeometry(0.17,32,32), goldMat2),
  {position: new THREE.Vector3(0,0,0)}
));

// Shaft connection nub
const nub = new THREE.Mesh(new THREE.CylinderGeometry(0.088,0.088,0.28,18), goldMat);
nub.rotation.z = Math.PI/2;
nub.position.set(0.52, -off, 0);
keyGroup.add(nub);

// Main shaft
const shL = 2.1;
const shaft = new THREE.Mesh(new THREE.BoxGeometry(shL, 0.175, 0.14), goldMat);
shaft.position.set(off + 0.28 + shL/2, -off, 0);
keyGroup.add(shaft);

// Ridge on top of shaft
const ridge = new THREE.Mesh(new THREE.BoxGeometry(shL*0.82, 0.055, 0.18), goldMat2);
ridge.position.set(shaft.position.x + 0.08, -off + 0.115, 0);
keyGroup.add(ridge);

// Blade end
const bladeX = off + 0.28 + shL;
const blade = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.38, 0.14), goldMat);
blade.position.set(bladeX + 0.07, -off - 0.1, 0);
keyGroup.add(blade);

// Teeth
[{dx:-0.55,h:0.16},{dx:-0.28,h:0.22},{dx:0.02,h:0.13}].forEach(({dx,h})=>{
  const t = new THREE.Mesh(new THREE.BoxGeometry(0.15, h, 0.14), goldMat2);
  t.position.set(bladeX + dx, -off - 0.175 - h/2, 0);
  keyGroup.add(t);
});

// Tilt key ~35° to match the concept art
keyGroup.rotation.z = -Math.PI / 5.2;
// Start off-screen above for intro animation
keyGroup.position.set(0.35, 4, 0);
keyGroup.scale.setScalar(0);
scene.add(keyGroup);

/* ── PARTICLE TRAIL ──────────────────────── */
const pPos = new Float32Array(PC * 3);

// Build a sweeping arc trail
for(let i=0; i<PC; i++){
  const t = i/PC;
  const angle = t * Math.PI * 0.9 - 0.2;
  pPos[i*3]   = Math.cos(angle) * (1.8 + (Math.random()-.5)*0.9);
  pPos[i*3+1] = Math.sin(angle) * 0.65 - 0.45 + (Math.random()-.5)*0.4;
  pPos[i*3+2] = (Math.random()-.5) * 0.35;
}

// Particle sprite texture
const pc2d = document.createElement('canvas');
pc2d.width = pc2d.height = 32;
const pctx = pc2d.getContext('2d');
const pg = pctx.createRadialGradient(16,16,0,16,16,16);
pg.addColorStop(0,  'rgba(255,225,80,1)');
pg.addColorStop(0.4,'rgba(212,175,55,.75)');
pg.addColorStop(1,  'rgba(212,175,55,0)');
pctx.fillStyle = pg;
pctx.fillRect(0,0,32,32);

pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos,3));

pMat = new THREE.PointsMaterial({
  size: 0.065,
  map: new THREE.CanvasTexture(pc2d),
  color: new THREE.Color(0xffd740),
  transparent: true, opacity: 0.78,
  depthWrite: false,
  blending: THREE.AdditiveBlending
});
const _pts = new THREE.Points(pGeo, pMat);
_pts.position.set(0.3, -0.2, -0.4);
_pts.visible = false;
scene.add(_pts);
particles = _pts;

/* ── ANIMATION STATE ─────────────────────── */
document.addEventListener('mousemove', e=>{
  mouseX = (e.clientX/window.innerWidth  - 0.5) * 2;
  mouseY = (e.clientY/window.innerHeight - 0.5) * 2;
});

/* ── RENDER LOOP ─────────────────────────── */
function tick(){
  requestAnimationFrame(tick);
  const t = performance.now() * 0.001;

  // Smooth mouse parallax
  parallaxX += (mouseX * 0.22 - parallaxX) * 0.055;
  parallaxY += (-mouseY * 0.16 - parallaxY) * 0.055;

  if(introComplete){
    keyGroup.rotation.x = parallaxY;
    keyGroup.rotation.y = parallaxX;
    keyGroup.position.x = 0.35 + parallaxX * 0.28;
    keyGroup.position.y = keyBaseY + Math.sin(t * 0.75) * 0.075 + parallaxY * 0.1;
  }

  // Animate particles gently
  if(particles.visible){
    pTime += 0.008;
    const pa = pGeo.attributes.position.array;
    for(let i=0; i<PC; i++){
      pa[i*3+1] += Math.sin(pTime + i * 0.28) * 0.0018;
      pa[i*3]   += Math.cos(pTime * 0.6 + i * 0.22) * 0.0008;
    }
    pGeo.attributes.position.needsUpdate = true;
    pMat.opacity = 0.55 + Math.sin(t * 1.4) * 0.12;
  }

  // Subtle light dance
  pt1.position.x = Math.sin(t * 0.55) * 1.8 + 1;
  pt1.position.y = Math.cos(t * 0.38) * 1.2 + 3;

  renderer.render(scene, camera);
}
tick();

/* ── RESIZE ──────────────────────────────── */
window.addEventListener('resize',()=>{
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});

} catch(err) {
  console.warn('[Feel\'HomeBnb] 3D key disabled:', err.message || err);
  const cv = document.getElementById('key-canvas');
  if(cv) cv.style.display = 'none';
}

/* ═══════════════════════════════════════════
   GSAP — always runs, 3D tweens only if key loaded
═══════════════════════════════════════════ */
const introTl = gsap.timeline({paused:true});

// 1. Fade loader out
introTl.to('#loader',{opacity:0, duration:.7, ease:'power2.inOut',
  onComplete:()=>{ document.getElementById('loader').style.display='none'; }
});

// 2. Key drops + scales in (only if Three.js succeeded)
if(keyGroup){
  introTl.to(keyGroup.position,{y:0, duration:1.3, ease:'back.out(1.4)'}, '-=0.1');
  introTl.to(keyGroup.scale,{x:1,y:1,z:1, duration:1.1, ease:'back.out(1.8)'}, '<');
}

// 3. Particles appear
introTl.call(()=>{ if(particles) particles.visible = true; }, null, '-=0.6');

// 4. Logo fades in
introTl.fromTo('#logo',
  {opacity:0, y:-22},
  {opacity:1, y:0, duration:.95, ease:'power3.out'}, '-=0.7'
);

// 5. Hero text slides in
introTl.fromTo('#hero-text',
  {opacity:0, x:-38},
  {opacity:1, x:0, duration:.9, ease:'power3.out'}, '-=0.65'
);

// 6. Window fades in
introTl.fromTo('#window-arch',
  {opacity:0, y:16},
  {opacity:1, y:0, duration:.8, ease:'power2.out'}, '-=0.5'
);

// 7. Properties bar rises
introTl.fromTo('#properties',
  {opacity:0, y:24},
  {opacity:1, y:0, duration:.75, ease:'power3.out'}, '-=0.4'
);

// 8. Corner ornaments
introTl.fromTo('.orn',
  {opacity:0},
  {opacity:1, duration:.5, stagger:.08, ease:'power2.out'}, '-=0.45'
);

// 9. Scroll hint
introTl.fromTo('#scroll-hint',
  {opacity:0},
  {opacity:1, duration:.4}, '-=0.2'
);

introTl.call(()=>{ introComplete = true; keyBaseY = 0; });

/* Loader entry animation, then kick off intro */
gsap.timeline()
  .to('.loader-key',  {opacity:1, y:0, duration:.6, ease:'power2.out'})
  .to('.loader-brand',{opacity:1,       duration:.7, ease:'power2.out'}, '-=0.2')
  .call(()=> introTl.play(), null, '+=1.0');

/* ── SCROLL PARALLAX (room bg) ───────────── */
gsap.to('.bg-room',{
  yPercent: 18, ease:'none',
  scrollTrigger:{trigger:'#hero',start:'top top',end:'bottom top',scrub:true}
});

/* gentle scroll parallax on text */
gsap.to('#hero-text',{
  y: -30, ease:'none',
  scrollTrigger:{trigger:'#hero',start:'top top',end:'bottom top',scrub:true}
});

})();
</script>
</body>
</html>
